# The model registry: every model the benchmark can run, with its exact
# pinned API version string and the prices used to compute cost_usd.
#
# Rules:
#   - api_model is always an exact, pinned version string. NEVER a floating
#     alias like "latest", "-latest", or a bare family name that a vendor
#     could silently repoint (e.g. use "gpt-5.1-2025-11-13", not "gpt-5.1"
#     alone, when the vendor offers a dated snapshot).
#   - id is our internal identifier: it's what ends up in episodes.model_id
#     and in task/report text. It stays stable even if api_model is later
#     repointed to a newer snapshot of the "same" model.
#   - Prices are USD per 1,000,000 tokens, taken from the vendor's own
#     pricing page for the exact api_model above (standard tier, text
#     tokens). cost_usd is computed from these plus actual token counts --
#     never estimated. See docs/models.md for the source and date of each
#     price, and for the reasoning behind each of the 5 model choices.
#   - max_turns is an optional override of the harness default (20); omit
#     to use the default.

models:
  - id: claude-opus-5
    provider: anthropic
    api_model: claude-opus-5
    input_price_per_million: 5.00
    output_price_per_million: 25.00

  - id: gpt-5.1
    provider: openai
    api_model: gpt-5.1-2025-11-13
    input_price_per_million: 1.25
    output_price_per_million: 10.00

  - id: gemini-3.1-pro
    provider: google
    api_model: gemini-3.1-pro-preview
    input_price_per_million: 2.00
    output_price_per_million: 12.00

  - id: claude-haiku-4.5
    provider: anthropic
    # The dated snapshot. `claude-haiku-4-5` is "a convenience alias that
    # resolves to the pinned snapshot claude-haiku-4-5-20251001" (checked
    # 2026-10-14, https://platform.claude.com/docs/en/models/haiku-4-5/overview).
    # That page also lists Claude Haiku 4.5 as legacy, retirement "Not sooner
    # than October 15, 2026": confirm it is still served before a real run.
    api_model: claude-haiku-4-5-20251001
    input_price_per_million: 1.00
    output_price_per_million: 5.00

  - id: deepseek-v3.2
    provider: openrouter
    api_model: deepseek/deepseek-v3.2
    # UNVERIFIED: OpenRouter's own pricing endpoint (GET /api/v1/models) was
    # not queried to produce these two numbers -- confirm them there before
    # running anything that spends real money. See docs/models.md.
    input_price_per_million: 0.27
    output_price_per_million: 1.10

# The judges: models that grade transcripts (consequence/graders/judge.py).
# Kept apart from `models:` so a judge's id never appears as an episode's
# model_id, and so judging cost is never mixed into experiment cost.
#
#   - api_model and prices are copied from the `models:` entry with the same
#     api_model, and carry exactly its sourcing (docs/models.md);
#     tests/test_grader_judge.py fails if they drift apart.
#   - context_window_tokens is taken from the vendor's documentation for that
#     exact api_model, with the page cited beside each value. The judge
#     refuses to run while it is null: the overflow check is what guarantees
#     a transcript is never cut to fit.
#   - Exactly one judge is primary: it grades every episode. The others are
#     run on a subset with `consequence grade --judge-model`.
#   - The primary judge is an Anthropic model, the same family as two of the
#     models under test (and the same model as one of them), a known
#     self-preference risk. The OpenAI judge is the cross-family check. See
#     docs/judge-methodology.md.
judges:
  - id: judge-claude-opus-5
    provider: anthropic
    # A pinned snapshot despite having no date: "Every Claude model ID is a
    # pinned snapshot, including the dateless IDs used from the 4.6
    # generation on." (https://platform.claude.com/docs/en/about-claude/models/overview)
    api_model: claude-opus-5
    input_price_per_million: 5.00
    output_price_per_million: 25.00
    # "Context window: 1M tokens" for claude-opus-5, checked 2026-10-14:
    # https://platform.claude.com/docs/en/models/opus-5/overview
    context_window_tokens: 1000000
    primary: true

  - id: judge-gpt-5.1
    provider: openai
    # The dated snapshot ("Snapshot: gpt-5.1-2025-11-13"), not the bare gpt-5.1.
    api_model: gpt-5.1-2025-11-13
    input_price_per_million: 1.25
    output_price_per_million: 10.00
    # "400,000 context window" for gpt-5.1 / gpt-5.1-2025-11-13, checked
    # 2026-10-14: https://developers.openai.com/api/docs/models/gpt-5.1
    context_window_tokens: 400000
