# The model registry: every model the benchmark can run, with its exact
# pinned API version string and the prices used to compute cost_usd.
#
# Rules:
#   - api_model is always an exact, pinned version string. NEVER a floating
#     alias like "latest", "-latest", or a bare family name that a vendor
#     could silently repoint (e.g. use "gpt-5.1-2025-11-13", not "gpt-5.1"
#     alone, when the vendor offers a dated snapshot).
#   - id is our internal identifier: it's what ends up in episodes.model_id
#     and in task/report text. It stays stable even if api_model is later
#     repointed to a newer snapshot of the "same" model.
#   - Prices are USD per 1,000,000 tokens, taken from the vendor's own
#     pricing page for the exact api_model above (standard tier, text
#     tokens). cost_usd is computed from these plus actual token counts --
#     never estimated. See docs/models.md for the source and date of each
#     price, and for the reasoning behind each of the 5 model choices.
#   - max_turns is an optional override of the harness default (20); omit
#     to use the default.

models:
  # The current Opus. Dateless but pinned: "Every Claude model ID is a pinned
  # snapshot, including the dateless IDs used from the 4.6 generation on."
  # Model ID, prices and status checked 2026-10-15:
  # https://platform.claude.com/docs/en/models/opus-5-5/overview
  - id: claude-opus-5.5
    provider: anthropic
    api_model: claude-opus-5-5
    input_price_per_million: 4.00
    output_price_per_million: 20.00
    price_note: "replaces claude-opus-5 ($5 / $25): 20% cheaper on input and output"

  - id: gpt-5.1
    provider: openai
    api_model: gpt-5.1-2025-11-13
    input_price_per_million: 1.25
    output_price_per_million: 10.00

  # Google's flagship, a stable code ("Stable: gemini-4-argon"; "our flagship
  # reasoning model"), replacing the preview-only gemini-3.1-pro-preview.
  # Checked 2026-10-15: https://ai.google.dev/gemini-api/docs/models/gemini-4-argon
  # Prices: https://ai.google.dev/gemini-api/docs/pricing -- "$2.00 through
  # November 30, 2026" / "$4.00 starting December 1, 2026" input, "$10.00" /
  # "$20.00" output (output includes thinking tokens). These are the prices
  # until November 30; a run on or after December 1 needs them updated first.
  - id: gemini-4-argon
    provider: google
    api_model: gemini-4-argon
    input_price_per_million: 2.00
    output_price_per_million: 10.00
    price_note: "doubles to $4 / $20 from December 1, 2026: update before any run on or after it"

  # The small, low-cost model, from a provider other than Anthropic: "a
  # low-latency, cost-effective multimodal model" ("Stable:
  # gemini-3.5-flash-lite"). Checked 2026-10-15:
  # https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash-lite
  # Prices: https://ai.google.dev/gemini-api/docs/pricing ("$0.30" input,
  # "$2.50" output, output includes thinking tokens).
  - id: gemini-3.5-flash-lite
    provider: google
    api_model: gemini-3.5-flash-lite
    input_price_per_million: 0.30
    output_price_per_million: 2.50
    price_note: "replaces claude-haiku-4.5 ($1 / $5)"

  - id: deepseek-v3.2
    provider: openrouter
    api_model: deepseek/deepseek-v3.2
    # UNVERIFIED: OpenRouter's own pricing endpoint (GET /api/v1/models) was
    # not queried to produce these two numbers -- confirm them there before
    # running anything that spends real money. See docs/models.md.
    input_price_per_million: 0.27
    output_price_per_million: 1.10

# The judges: models that grade transcripts (consequence/graders/judge.py).
# Kept apart from `models:` so a judge's id never appears as an episode's
# model_id, and so judging cost is never mixed into experiment cost.
#
#   - Prices: when a judge's api_model is also a model under test, they are
#     copied from that `models:` entry (tests/test_grader_judge.py fails if
#     they drift apart); otherwise they cite the vendor page here.
#   - context_window_tokens is taken from the vendor's documentation for that
#     exact api_model, with the page cited beside each value. The judge
#     refuses to run while it is null: the overflow check is what guarantees
#     a transcript is never cut to fit.
#   - Exactly one judge is primary: it grades every episode. The others are
#     run on a subset with `consequence grade --judge-model`.
#   - The primary judge must accept a temperature (0 and 0.7). Current Claude
#     models (Opus 4.7 and later) reject any non-default temperature with a
#     400; Opus 4.6 accepts one while thinking is off, which it is by default.
#   - The primary judge is an Anthropic model, the same family as one model
#     under test (claude-opus-5.5), a known self-preference risk. The OpenAI
#     judge is the cross-family check. See docs/judge-methodology.md.
judges:
  - id: judge-claude-opus-4.6
    provider: anthropic
    # Pinned (dateless from the 4.6 generation on). "On older models, the
    # restriction applies only while thinking is on: temperature and top_k
    # are incompatible with thinking" -- and on Opus 4.6 "thinking is off until
    # you set thinking: {type: "adaptive"}", which the adapter never sets.
    # (https://platform.claude.com/docs/en/build-with-claude/thinking)
    # Status "Active (legacy)", retirement "Not sooner than February 5, 2027".
    api_model: claude-opus-4-6
    # "$5 / MTok" input, "$25 / MTok" output, checked 2026-10-15:
    # https://platform.claude.com/docs/en/models/opus-4-6/overview
    input_price_per_million: 5.00
    output_price_per_million: 25.00
    # "Context window: 1M tokens" for claude-opus-4-6, same page.
    context_window_tokens: 1000000
    primary: true

  - id: judge-gpt-5.1
    provider: openai
    # The dated snapshot ("Snapshot: gpt-5.1-2025-11-13"), not the bare gpt-5.1.
    api_model: gpt-5.1-2025-11-13
    input_price_per_million: 1.25
    output_price_per_million: 10.00
    # "400,000 context window" for gpt-5.1 / gpt-5.1-2025-11-13, checked
    # 2026-10-14: https://developers.openai.com/api/docs/models/gpt-5.1
    context_window_tokens: 400000
